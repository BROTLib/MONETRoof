name: Release library

# Builds the tagged version with TcBuild on the shared self-hosted runner, saves it as a .library and
# attaches it to the GitHub Release for that tag (creating the release if it does not exist yet).
# tag-release.yml dispatches this after it pushes a new tag; it can also be run by hand to (re)build
# one. Keep the trigger workflow_dispatch only, never push/pull_request -- a PR from any fork would
# otherwise execute on the self-hosted runner (see tcbuild.yml).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.4.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  library:
    runs-on: [self-hosted, twincat, windows]
    steps:
      - name: Validate tag
        shell: powershell
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ($env:TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Tag must look like v0.4.1, got '$env:TAG'" }

      - name: Checkout tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag }}

      - name: Save library
        shell: powershell
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $file = Join-Path $env:RUNNER_TEMP "MONETRoof_$($env:TAG).library"
          # tools/Invoke-XaeBuild.ps1 drives XAE through its automation interface and replaces TcBuild.exe, which
          # gave up after about 17 s on a cold XAE start (exit 3). It must be in the tagged tree, so a tag from
          # before it was added cannot be re-released with this workflow. Exit 1 = built with compile warnings.
          & "$env:GITHUB_WORKSPACE\tools\Invoke-XaeBuild.ps1" install MonetRoof.sln -XaeProject MonetRoof -PlcProject MonetRoof -LibraryFile $file
          if ($LASTEXITCODE -gt 1) { throw "Invoke-XaeBuild.ps1 failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $file)) { throw "Invoke-XaeBuild.ps1 did not write $file" }
          "LIBRARY_FILE=$file" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Attach to GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Continue'
          gh release view $env:TAG 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $env:LIBRARY_FILE --clobber
          } else {
            gh release create $env:TAG $env:LIBRARY_FILE --verify-tag --title $env:TAG --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed with exit code $LASTEXITCODE" }