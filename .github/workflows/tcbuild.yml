name: TcBuild

# Compile check on every release, plus on demand. `main` only receives release PRs (develop -> main, see
# release.yml), so a push to main is a release. Not a tag trigger: tag-release.yml pushes the tag with
# GITHUB_TOKEN, and events caused by that token do not start workflows. Ordinary pushes are covered by
# tests.yml, which installs (so compiles) MONETRoof and runs the tests.
#
# runs-on is a self-hosted runner and most of these repos are public. Therefore: `push` only, NEVER
# `pull_request` / `pull_request_target` -- a PR from any fork would otherwise execute on the runner
# (BROTLib#31; an earlier push+PR auto-trigger did exactly that and was reverted, see BROTLib
# specs/design/twincat-ci-runner-setup.md). A push can only come from someone with write access.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tcbuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, twincat, windows]
    steps:
      - uses: actions/checkout@v4

      - name: Build MonetRoof.sln
        shell: powershell
        run: |
          # TcBuild exit codes: 0 = built, 1 = built with compile warnings (still a success),
          # 2 = compile errors, 3 = COM busy (Invoke-TcBuild.ps1 retries), 4/5 = other failure, 6 = lock timeout (Invoke-TcBuild.ps1)
          & .\MonetRoofTests\tools\Invoke-TcBuild.ps1 build MonetRoof.sln
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          exit 0